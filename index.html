<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Culina - Premium Recipe App</title>
    <meta name="description" content="Culina - Your premium destination for exquisite culinary experiences with professional recipe modules and kitchen tools.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Sidebar Navigation -->
        <nav class="sidebar" id="sidebar">
            <div class="logo">
                <div class="logo-icon"><i data-lucide="chef-hat"></i></div>
                <span>Culina</span>
            </div>

            <div class="nav-section-label">MAIN MENU</div>
            <ul class="nav-links">
                <li><a href="#" data-route="home" class="active" id="nav-home"><i data-lucide="home"></i> <span>Home</span></a></li>
                <li><a href="#" data-route="modules" id="nav-modules"><i data-lucide="book-open"></i> <span>Recipe Modules</span></a></li>
                <li><a href="#" data-route="tools" id="nav-tools"><i data-lucide="wrench"></i> <span>Kitchen Tools</span></a></li>
                <li><a href="#" data-route="favorites" id="nav-favorites"><i data-lucide="heart"></i> <span>My Favorites</span></a></li>
                <li><a href="#" data-route="progress" id="nav-progress"><i data-lucide="trophy"></i> <span>My Progress</span></a></li>
            </ul>

            <div class="nav-section-label">MANAGEMENT</div>
            <ul class="nav-links">
                <li><a href="#" data-route="admin" id="nav-admin" class="admin-nav-link"><i data-lucide="shield-check"></i> <span>Admin Area</span></a></li>
            </ul>

            <div class="sidebar-user">
                <div class="user-avatar">C</div>
                <div class="user-info">
                    <span class="user-name">Chef User</span>
                    <span class="user-role">Premium Member</span>
                </div>
            </div>
        </nav>

        <!-- Mobile Header -->
        <div class="mobile-header">
            <button class="menu-toggle" onclick="toggleSidebar()"><i data-lucide="menu"></i></button>
            <div class="logo"><div class="logo-icon"><i data-lucide="chef-hat"></i></div><span>Culina</span></div>
        </div>

        <!-- Main Content Area -->
        <main id="main-content"></main>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
